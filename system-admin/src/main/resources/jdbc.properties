# 本地开发默认配置；容器通过环境变量覆盖，不依赖个人电脑路径。
user=${DB_USER:rental}
password=${DB_PASSWORD:123456}
url=${DB_URL:jdbc:mysql://127.0.0.1:3306/rental-system?characterEncoding=utf8&serverTimezone=Asia/Hong_Kong&useSSL=false&allowPublicKeyRetrieval=true}
driverName=com.mysql.cj.jdbc.Driver
redisHost=${REDIS_HOST:127.0.0.1}
redisPort=${REDIS_PORT:6379}