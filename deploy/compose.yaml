# 业务与测试通过不同 COMPOSE_PROJECT_NAME 使用隔离网络和数据卷。
name: ${COMPOSE_PROJECT_NAME:-rentalsys-demo}
services:
  mysql:
    image: mysql:8.4.11
    mem_limit: 768m
    environment:
      MYSQL_DATABASE: rental-system
      MYSQL_USER: rental
      MYSQL_PASSWORD: ${DB_PASSWORD:-123456}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-123456}
      TZ: Asia/Hong_Kong
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_general_ci"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP -h127.0.0.1 -urental rental-system -Nse 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7.4.11-alpine
    mem_limit: 128m
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    image: tomcat:9.0.123-jre11-temurin-noble
    mem_limit: 768m
    environment:
      TZ: Asia/Hong_Kong
      JAVA_OPTS: "-Xms128m -Xmx512m -Dfile.encoding=UTF-8"
      DB_URL: "jdbc:mysql://mysql:3306/rental-system?characterEncoding=utf8&serverTimezone=Asia/Hong_Kong&useSSL=false&allowPublicKeyRetrieval=true"
      DB_USER: rental
      DB_PASSWORD: ${DB_PASSWORD:-123456}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports: ["127.0.0.1:${BACKEND_PORT:-8088}:8080"]
    volumes:
      - ../system-admin/target/admin.war:/usr/local/tomcat/webapps/admin.war:ro
      - backend_logs:/logs
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 4 http://127.0.0.1:8080/admin/api/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  frontend:
    image: rentalsys-frontend:2.0.0
    profiles: ["web"]
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    mem_limit: 128m
    environment: {BACKEND_URL: "http://backend:8080"}
    ports: ["127.0.0.1:${WEB_PORT:-80}:8080"]
    depends_on: {backend: {condition: service_healthy}}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 10
volumes:
  mysql_data:
  redis_data:
  backend_logs:
